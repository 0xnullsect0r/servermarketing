<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="Isometric floating island with a central tower">
  <title>Homies' International</title>

  <rect width="512" height="512" fill="#121A2E"/>

  <g fill="#FFFFFF" opacity="0.62">
    <rect x="70"  y="96"  width="14" height="14"/>
    <rect x="424" y="140" width="12" height="12"/>
    <rect x="386" y="64"  width="10" height="10"/>
  </g>

  <!-- ISLAND (drawn first so the tower sits on it) -->
  <polygon points="256,265 406,340 256,415 106,340" fill="#7DC74E"/>
  <polygon points="106,340 256,415 256,443 106,368" fill="#9A6A43"/>
  <polygon points="406,340 256,415 256,443 406,368" fill="#7A5233"/>
  <polygon points="106,368 256,443 256,478"         fill="#7C7A88"/>
  <polygon points="406,368 256,443 256,478"         fill="#5A5866"/>

  <!-- drifting block -->
  <polygon points="140,415 164,427 140,439 116,427" fill="#7DC74E"/>
  <polygon points="116,427 140,439 140,453 116,441" fill="#9A6A43"/>
  <polygon points="164,427 140,439 140,453 164,441" fill="#7A5233"/>

  <!-- TOWER -->
  <polygon points="208,166 256,190 256,360 208,336" fill="#D4DBEA"/>
  <polygon points="304,166 256,190 256,360 304,336" fill="#97A0B7"/>
  <polygon points="256,142 304,166 256,190 208,166" fill="#EEF2FA"/>

  <polygon points="220,172 244,184 244,214 220,202" fill="#FFC63D"/>
  <polygon points="220,232 244,244 244,274 220,262" fill="#FFC63D"/>
  <polygon points="292,172 268,184 268,214 292,202" fill="#E0A426"/>
  <polygon points="292,232 268,244 268,274 292,262" fill="#E0A426"/>

  <!-- ROOF, overhanging the shaft -->
  <polygon points="256,80 194,172 256,202" fill="#D05B44"/>
  <polygon points="256,80 318,172 256,202" fill="#9E3F2F"/>
</svg>
