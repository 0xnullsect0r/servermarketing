<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="A floating island with a lit tower">
  <title>Homies' International</title>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#0B1229"/>
      <stop offset="0.62" stop-color="#1B2A55"/>
      <stop offset="1"   stop-color="#2A3F74"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#E4EAF6"/>
      <stop offset="0.55" stop-color="#C3CDE2"/>
      <stop offset="1"    stop-color="#96A2BD"/>
    </linearGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#53456E"/>
      <stop offset="1" stop-color="#2B2440"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#63CE4F"/>
      <stop offset="1" stop-color="#3C8B33"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect width="512" height="512" fill="url(#sky)"/>

  <!-- stars: decorative, vanish gracefully at 64px -->
  <g fill="#FFFFFF" opacity="0.85">
    <circle cx="94"  cy="96"  r="7"/>
    <circle cx="418" cy="138" r="6"/>
    <circle cx="372" cy="62"  r="5"/>
    <circle cx="132" cy="196" r="5"/>
  </g>

  <!-- tower roof -->
  <polygon points="256,72 322,132 190,132" fill="#B04A3A"/>
  <!-- parapet -->
  <rect x="188" y="132" width="136" height="30" rx="4" fill="url(#stone)"/>
  <!-- beacon -->
  <rect x="232" y="138" width="48" height="18" rx="4" fill="#FFC03A"/>
  <!-- shaft -->
  <rect x="214" y="162" width="84" height="172" fill="url(#stone)"/>
  <!-- windows -->
  <rect x="240" y="196" width="32" height="26" rx="3" fill="#FFC03A"/>
  <rect x="240" y="256" width="32" height="26" rx="3" fill="#FFC03A"/>

  <!-- island: grass cap -->
  <polygon points="96,314 416,314 404,352 108,352" fill="url(#grass)"/>
  <!-- island: rock underside -->
  <polygon points="108,352 404,352 374,392 336,420 298,442 268,458 246,450 206,424 158,390"
           fill="url(#rock)"/>

  <!-- small drifting rock, for depth -->
  <polygon points="366,404 386,418 368,434 352,418" fill="#3B3154"/>
</svg>
